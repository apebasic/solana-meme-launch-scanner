name: milestone1-verify

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project and dev dependencies
        run: python -m pip install -e .[dev]

      - name: Run tests
        run: python -m pytest

      - name: CLI help smoke check
        run: python -m app.cli --help
